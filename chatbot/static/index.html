<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyBot Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header><span class="dot"></span><div><h1>PyBot</h1><small>Rule-based chatbot</small></div></header>
    <div id="log" class="log" aria-live="polite"></div>
    <div class="chips">
      <button data-say="hello">hello</button>
      <button data-say="how are you">how are you</button>
      <button data-say="what time is it">time</button>
      <button data-say="bye">bye</button>
    </div>
    <div class="row">
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" autofocus>
      <button id="send">Send</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
